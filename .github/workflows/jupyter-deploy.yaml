name: MyST GitHub Pages Deploy
on:
  push:
    branches: [main]
env:
  BASE_URL: /${{ github.event.repository.name }}

permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: 'pages'
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Install MyST Markdown
        run: npm install -g mystmd
      - name: Build HTML Assets
        working-directory: ./publish
        run: myst build --html
      # doesn't seem to work yet:
      - name: Rewrite localhost URLs in sitemap
        working-directory: ./publish
        run: |
          if [ -f ./_build/html/sitemap.xml ]; then
            sed -i 's|http://localhost:[0-9]*|https://arazni.github.io/blog|g' ./_build/html/sitemap.xml
          fi
      
      # Python Feeds
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: pip install feedgen pyyaml
      - name: Generate RSS and Atom feeds
        run: python generate_rss.py

      # Upload
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "publish/_build/html"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
